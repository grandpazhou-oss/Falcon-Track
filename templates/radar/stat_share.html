<div class="table-wrap"><table class="stats-table"><thead><tr><th>{{ "类别"|ui:ui_lang }}</th><th>{{ "数量"|ui:ui_lang }}</th><th>{{ "占比"|ui:ui_lang }}</th></tr></thead>
<tbody>{% for row in rows %}<tr><th>{{ row.name|ui:ui_lang }}</th><td>{{ row.count }}</td><td>{% if row.share != None %}{{ row.share }}%{% else %}—{% endif %}</td></tr>{% empty %}<tr><td colspan="3">{{ "暂无记录"|ui:ui_lang }}</td></tr>{% endfor %}</tbody></table></div>
