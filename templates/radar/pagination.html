{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="{{ "分页"|ui:ui_lang }}"><span>{{ "第"|ui:ui_lang }} {{ page.number }} / {{ page.paginator.num_pages }} {{ "页"|ui:ui_lang }}</span><div>{% if page.has_previous %}<a class="button small secondary" href="?{{ query_params }}{% if query_params %}&{% endif %}page={{ page.previous_page_number }}">{{ "上一页"|ui:ui_lang }}</a>{% endif %}{% if page.has_next %}<a class="button small secondary" href="?{{ query_params }}{% if query_params %}&{% endif %}page={{ page.next_page_number }}">{{ "下一页"|ui:ui_lang }}</a>{% endif %}</div></nav>{% endif %}
