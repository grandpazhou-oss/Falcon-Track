[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "falcon-track"
version = "0.1.0"
description = "Local-first logistics procurement discovery and review pilot"
requires-python = ">=3.11,<3.15"
dependencies = [
  "Django>=5.2,<5.3",
  "Scrapy>=2.13,<3",
  "prefect>=3.4,<4",
  "pydantic>=2.11,<3",
  "httpx[socks]>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "waitress>=3,<4",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=6,<7",
  "pymupdf>=1.26,<2",
  "filelock>=3.16,<4",
  "keyring>=25,<26",
]

[project.optional-dependencies]
browser = ["scrapy-playwright>=0.0.44,<1"]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["config*", "radar*", "collectors*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
pythonpath = ["."]

